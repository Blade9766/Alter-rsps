  # ------------------------------------------------------------------------------------
  # RANGED
  #
  # Ranged does NOT follow the metal ladder above, and most ammunition is not gated at all.
  #
  # The distinction the cache already makes, and which was verified against the wiki before
  # anything here was written: a *launcher* carries the requirement, and low-tier ammunition
  # does not. Adamant arrows, dragon javelins and iron bolts each have no Ranged parameter in
  # this cache, and their wiki infoboxes have no requirement field either - the pages say the
  # arrow "can be used by any standard bow of maple or stronger" and the bolts "may be shot
  # from iron or better crossbows". So arrows, javelins and sub-mithril bolts are deliberately
  # absent from this file: they are correctly ungated, not missing.
  #
  # What IS gated is anything held in the weapon slot - bows, crossbows, darts, knives,
  # thrownaxes - plus the higher bolts, which take their level from the crossbow that fires
  # them rather than from their metal. That is why mithril bolts are 36 and not 20: the
  # mithril crossbow is 36.
  #
  # Levels, all wiki-verified and each corroborated by at least one item the cache already
  # gates at the same number:
  #   crossbows   blurite 16, iron 26, steel 31, mithril 36, adamant 46, rune 61, dragon 64
  #   bows        oak 5, willow 20, maple 30, yew 40, magic 50
  #   darts       steel 5, black 10, mithril 20, adamant 30, rune 40, amethyst 50, dragon 60
  #   knives      steel 5, black 10, mithril 20, adamant 30, rune 40, dragon 60
  #   thrownaxes  steel 5, mithril 20, adamant 30, rune 40, dragon 61
  #   bolts       mithril 36, adamant 46, runite 61, dragon 64
  #
  # Bronze and iron tiers are omitted throughout: their requirement is level 1, which every
  # account already meets, so an entry for them would be a row that can never fire.
  #
  # The named exceptions are left to the cache, which already has them right: Karil's, the
  # Armadyl and dragon hunter crossbows at 70, and the Zaryte at 80 - none of which follows
  # the ladder their name would suggest.
