  # ---------------------------------------------------------------------------------------
  # Strength-gated melee weapons.
  #
  # Almost nothing below carries a requirement in this cache, so a level 1 account could swing
  # a dragon warhammer or a scythe of vitur. Levels are per-weapon off the wiki rather than off
  # the metal ladder, because these weapons do not follow it: warhammers gate on Strength
  # *instead of* Attack, and halberds want Attack at the tier and Strength at half of it.
  #
  # **Seven ids here do already carry their requirement from the cache**, and restating them is
  # a no-op rather than a correction - the loader merges per skill and never overwrites. They
  # are kept so each family reads as a complete set: Granite hammer (21742) and Granite
  # longsword (21646) at 50/50, Barrelchest anchor (10887) at 60/40, Tzhaar-ket-om (6528) and
  # Dragon warhammer (13576) at 60 Strength, Elder maul (21003) at 75/75, and Scythe of vitur
  # (22325) at 80/90. Every one agrees with the value written here, which is a useful check on
  # the wiki figures the rest of the section rests on.
  # ---------------------------------------------------------------------------------------

  # Warhammers - Strength only, no Attack requirement at all. Confirmed on the rune, dragon
  # and mithril pages, all three of which say so outright; the 2021-04-21 update moved the
  # whole family from Attack to Strength. Bronze and iron are level 1 and so gate nothing.
  # White also wants Wanted!, which this file does not model - see the header.
  - skillReqs:
      - { skill: strength, level: 5 }
    items:
      - { id: 1339, name: "Steel warhammer" }

  - skillReqs:
      - { skill: strength, level: 10 }
    items:
      - { id: 1341, name: "Black warhammer" }
      - { id: 6613, name: "White warhammer" }

  - skillReqs:
      - { skill: strength, level: 20 }
    items:
      - { id: 1343, name: "Mithril warhammer" }

  - skillReqs:
      - { skill: strength, level: 30 }
    items:
      - { id: 1345, name: "Adamant warhammer" }

  - skillReqs:
      - { skill: strength, level: 40 }
    items:
      - { id: 1347, name: "Rune warhammer" }

  # Halberds - Attack at the tier, Strength at half of it (black 10/5, mithril 20/10,
  # adamant 30/15, rune 40/20, dragon 60/30 above). Bronze, iron and steel stop at their
  # Attack level and ask for no Strength, so they stay on the Attack ladder further up.
  - skillReqs:
      - { skill: attack, level: 10 }
      - { skill: strength, level: 5 }
    items:
