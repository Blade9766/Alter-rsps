# Equipment level requirements the cache does not carry.
#
# The 228 cache stores requirements as item params (434/436 and friends), and
# ItemMetadataService reads them - but the cache only carries them from the rune tier
# upward, and not even completely there. A probe of all 5,492 equippable items found
# only 618 with any requirement at all, and no Attack requirement below level 30:
# steel (5), black/white (10) and mithril (20) are absent outright, adamant (30) has
# two entries, and a scattering above that - dragon halberd, dragon battleaxe, dragon
# 2h sword, the whole granite set - carry none either. The practical effect was that a
# level 1 account could wear full adamant and swing a dragon battleaxe.
#
# Everything here is *additive*: a requirement is only written for a skill the item
# does not already declare, so the cache's own params and the per-item documents in
# itemOverrides/ both stay authoritative. Nothing in this file overrides them.
#
# Levels are the OSRS metal ladder - steel 5, black/white 10, mithril 20, adamant 30,
# rune 40, granite 50, dragon 60 - applied to melee weapons (Attack) and melee armour
# (Defence). Item ids and names are read straight out of the cache; the verify test
# asserts each id still carries the name recorded here, so a cache bump that moves an
# id fails the build rather than silently gating the wrong item.
#
# Ranged is covered too, but on a different ladder - see the RANGED section at the foot of
# this file for where its numbers come from and why most ammunition is correctly ungated.
#
# Deliberately NOT covered:
#   - Quest gating. White equipment needs Wanted!, the dragon halberd needs Regicide,
#     dragon platebody needs a diary - none of that is modelled here, only the levels.
#   - Cosmetic and non-tier items that merely share a colour word: black partyhats,
#     black d'hide, wizard robes, masks, granite rings, Recipe for Disaster gloves.
#   - Crystal halberds. They want 70 Attack, 35 Strength *and* 50 Agility, and the loader
#     only understands the five combat skills, so gating them here would gate them wrongly.
#     They also spread across two dozen charge-state ids, and the Hard Western Provinces
#     diary they really hang on is not modelled either.

