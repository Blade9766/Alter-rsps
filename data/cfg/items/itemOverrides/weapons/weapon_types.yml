---
# Weapon type corrections for items their cache category cannot tell apart.
#
# `ItemMetadataService` derives an item's weapon type - the Combat Options panel, and with it
# every attack style the server resolves - from the item's cache category, via
# `org.alter.game.service.game.WeaponCategory`. That works for categories that hold one kind
# of weapon, but a few do not:
#
#  - Category 1 is every staff there is, from a plain Staff of air (weapon type 18, two
#    autocast buttons) to a trident (weapon type 24, which attacks with magic on its own and
#    has no autocast at all). The category resolves to 18, which left every powered staff
#    swinging as a melee crush weapon with no crush bonus.
#  - Category 26 is blunt weapons (weapon type 2: Pound, Pummel, Block), but the abyssal
#    bludgeon's three buttons are all Aggressive, which is weapon type 27.
#
# Weapon type ids are the values of varbit 357; see `org.alter.api.WeaponType`.

id: 11905
name: "Trident of the seas (full)"
equipment:
  weaponType: 24

