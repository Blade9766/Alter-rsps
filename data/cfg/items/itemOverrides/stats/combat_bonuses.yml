---
# Equipment bonus corrections, against the live game's own numbers.
#
# Every value here was diffed against the OSRS Wiki's equipment table (the dump the wiki's own
# DPS calculator is built from, https://oldschool.runescape.wiki/w/Calculator:DPS) on 2026-09-03,
# item id by item id, over all 4,691 equippable items the rev-228 cache and the wiki have in
# common. Only the fields that actually differ are written, so the cache keeps everything it
# already gets right.
#
# What the differences are:
#
#  - Balance changes made after this cache was built. The 2024 melee rebalance raised the Ghrazi
#    rapier, the Blade of Saeldor and the Inquisitor's set; the magic rebalance gave the master
#    wand +10% magic damage and doubled the ancient sceptres' to 10%.
#  - Charged variants that carry the uncharged stats. The charged dragonfire shield, dragonfire
#    ward and ancient wyvern shield all read fifty points of defence short.
#  - Items whose bonuses the cache simply never got: the imbued and historical crystal bows and
#    shields sit at a flat zero.
#
# Deliberately not corrected here: the Deadman Mode, Emir's Arena and Wilderness Wars copies,
# whose wiki rows describe a different balance pass than the one in this cache, and the five
# salamanders, whose magic damage the wiki's equipment table does not record at all (it is read
# from cache param 65 instead - see ParamMapper).

