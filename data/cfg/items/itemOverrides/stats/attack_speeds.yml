---
# Attack speeds for weapons the cache does not give one.
#
# `ItemMetadataService` reads the attack rate from cache param 14 and falls back to 7 ticks when
# it is absent - and it is absent on 432 of the 1,443 weapon-slot items in this cache. Seven ticks
# is slower than all but the heaviest two-handers, so every one of those weapons swung at roughly
# half its real rate: the Kodai wand, master wand and every other wand at 7 instead of 4, the
# staff of the dead and the staff of light at 7 instead of 4, the blackjacks at 7 instead of 4,
# the Gauntlet's crystal and corrupted weapons at 7 instead of 4, and each Barrows weapon's fully
# degraded (0) form at 7 rather than the 5, 6 or 7 its charged form uses.
#
# Speeds are the live game's, taken from the same wiki equipment table as the bonus corrections
# beside this file, on 2026-09-03. Only weapons whose speed differs from what the cache yields are
# listed.

